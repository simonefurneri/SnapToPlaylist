<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#141E1B" />
      <stop offset="70%" stop-color="#090C10" />
      <stop offset="100%" stop-color="#05070A" />
    </radialGradient>

    <!-- Spotify Emerald & Neon Cyan Gradients -->
    <linearGradient id="neonGreen" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="50%" stop-color="#1DB954" />
      <stop offset="100%" stop-color="#0df2c9" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0" y1="256" x2="512" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0" />
      <stop offset="25%" stop-color="#1ed760" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0df2c9" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#1ed760" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1DB954" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="apertureMetallic" x1="120" y1="120" x2="256" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="vinylGroove" x1="256" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="30%" stop-color="#090D16" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <linearGradient id="sparkleGrad" x1="330" y1="100" x2="400" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0df2c9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intenseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="#1E293B" stroke-width="4" />

  <!-- 2. Neon Soundwaves radiating across -->
  <path d="M 20 256 C 80 256 90 200 120 200 C 150 200 160 256 220 256 C 280 256 290 200 320 200 C 350 200 360 256 492 256" stroke="url(#waveGrad)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#outerGlow)" opacity="0.85" />
  <path d="M 20 256 C 80 256 90 312 120 312 C 150 312 160 256 220 256 C 280 256 290 312 320 312 C 350 312 360 256 492 256" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#outerGlow)" opacity="0.6" />

  <!-- 3. Outer Glowing Ring -->
  <circle cx="256" cy="256" r="148" stroke="url(#neonGreen)" stroke-width="6" filter="url(#intenseGlow)" fill="#090D16" />

  <!-- 4. Left Side: Camera Shutter / Aperture Blades (Clip to left half) -->
  <g clip-path="url(#leftHalf)">
    <clipPath id="leftHalf">
      <rect x="100" y="100" width="156" height="312" />
    </clipPath>
    <!-- Aperture Blades -->
    <circle cx="256" cy="256" r="142" fill="url(#apertureMetallic)" />
    <path d="M 120 200 L 256 256" stroke="#38BDF8" stroke-width="3" opacity="0.4" />
    <path d="M 160 140 L 256 256" stroke="#1DB954" stroke-width="4" />
    <path d="M 140 330 L 256 256" stroke="#1DB954" stroke-width="4" />
    <path d="M 200 385 L 256 256" stroke="#38BDF8" stroke-width="3" opacity="0.4" />
    <!-- Lens reflection -->
    <path d="M 150 160 A 130 130 0 0 0 130 250" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- 5. Right Side: Vinyl Record with Grooves (Clip to right half) -->
  <g clip-path="url(#rightHalf)">
    <clipPath id="rightHalf">
      <rect x="256" y="100" width="156" height="312" />
    </clipPath>
    <circle cx="256" cy="256" r="142" fill="url(#vinylGroove)" />
    <circle cx="256" cy="256" r="128" stroke="#334155" stroke-width="2" opacity="0.7" />
    <circle cx="256" cy="256" r="114" stroke="#1E293B" stroke-width="3" />
    <circle cx="256" cy="256" r="100" stroke="#334155" stroke-width="2" opacity="0.8" />
    <circle cx="256" cy="256" r="86" stroke="#1E293B" stroke-width="2" />
    <circle cx="256" cy="256" r="72" stroke="#334155" stroke-width="2" opacity="0.7" />
  </g>

  <!-- 6. Center Hub: Camera Lens Pupil / Vinyl Center -->
  <circle cx="256" cy="256" r="46" fill="url(#neonGreen)" filter="url(#intenseGlow)" />
  <circle cx="256" cy="256" r="38" fill="#1DB954" />
  <circle cx="256" cy="256" r="16" fill="#090D16" />
  <circle cx="248" cy="248" r="6" fill="#FFFFFF" opacity="0.6" />

  <!-- 7. Gemini AI Sparkle Star (Top Right) -->
  <path d="M 370 100 Q 370 130 400 130 Q 370 130 370 160 Q 370 130 340 130 Q 370 130 370 100 Z" fill="url(#sparkleGrad)" filter="url(#intenseGlow)" />
  <circle cx="390" cy="155" r="4" fill="#FFFFFF" filter="url(#intenseGlow)" />
</svg>
